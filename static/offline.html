<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaringan Putus - Offline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 400px;
            width: 100%;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
        }
        p {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .back-to-home{
            margin-top:24px;
        }   
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🌐🔌</div>
        <h1>Anda Lagi Offline</h1>
        <p>Koneksi internet Anda lagi putus atau tidak stabil. Halaman ini belum pernah dibuka sebelumnya, jadi belum tersimpan di cache HP/Browser.</p>
        <button class="btn" onclick="cobaManeh()">Coba Lagi</button>
        <a href="/" class="btn back-to-home">Kembali Ke Beranda</a>
    </div>
    <script>
        function cobaManeh() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                const btn = document.querySelector('.btn');
                btn.style.backgroundColor = '#dc2626';
                btn.innerText = 'Masih Offline, Bro'; 
                setTimeout(() => {
                    btn.style.backgroundColor = '#2563eb';
                    btn.innerText = 'Coba Lagi';
                }, 2000);
            }
        }
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
